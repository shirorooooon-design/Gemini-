<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyFlow</title>
  
  <!-- PWA用の設定 -->
  <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIlN0dWR5RmxvdyIsCiAgInNob3J0X25hbWUiOiAiU3R1ZHlGbG93IiwKICAic3RhcnRfdXJsIjogIi4vIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjMGYxNzJhIiwKICAidGhlbWVfY29sb3IiOiAiIzYzNjZmMSIsCiAgImljb25zIjogWwogICAgewogICAgICAic3JjIjogImRhdGE6aW1hZ2Uvc3ZnK3htbDt1dGY4LDxzdmcgeG1sbnM9J2h0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnJyB2aWV3Qm94PScwIDAgMTAwIDEwMCc+PHJlY3Qgd2lkdGg9JzEwMCcgaGVpZ2h0PScxMDAnIHJ4PScyMCcgZmlsbD0nJTYzNjZmMScvPjx0ZXh0IHg9JzUwJyB5PSc2NScgZm9udC1zaXplPSc1MCcgdGV4dC1hbmNob3I9J21pZGRsZSc+📚PC90ZXh0Pjwvc3ZnPiIsCiAgICAgICJzaXplcyI6ICI1MTJ4NTEyIiwKICAgICAgInR5cGUiOiAiaW1hZ2Uvc3ZnK3htbCIKICAgIH0KICBdCn0=">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-primary: #6366f1;
      --success: #10b981;
      --success-light: rgba(16, 185, 129, 0.15);
      --danger: #ef4444;
      --pace-light-bg: rgba(56, 189, 248, 0.2);
      --pace-light-border: #38bdf8;
      --pace-normal-bg: rgba(99, 102, 241, 0.2);
      --pace-normal-border: #6366f1;
      --pace-heavy-bg: rgba(236, 72, 153, 0.2);
      --pace-heavy-border: #ec4899;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif; }
    body { background: var(--bg-gradient); background-attachment: fixed; color: var(--text-main); min-height: 100vh; padding: 24px 16px; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 680px; }
    
    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 1.8rem; font-weight: 700; background: linear-gradient(135deg, #a5b4fc 0%, #c084fc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* 通知設定エリア */
    .notif-box {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid var(--accent-primary);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .notif-title { font-size: 0.85rem; color: #a5b4fc; font-weight: 600; }
    .notif-controls { display: flex; gap: 8px; align-items: center; }
    .time-input {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-main);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }
    .btn-notif { background: var(--accent-primary); color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; cursor: pointer; }

    /* 今日の優先タスクエリア */
    .hero-section {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid var(--accent-primary);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 12px 32px rgba(99, 102, 241, 0.25);
    }
    
    .section-title { font-size: 1.2rem; font-weight: 700; color: #ffffff; margin-bottom: 12px; }

    /* 一括ペースセレクター */
    .global-pace-box { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 12px; margin-bottom: 16px; }
    .pace-label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
    .global-pace-options { display: flex; gap: 8px; }
    .global-pace-btn { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(30, 41, 59, 0.6); color: var(--text-muted); font-size: 0.85rem; font-weight: 700; cursor: pointer; text-align: center; transition: all 0.2s; }
    .global-pace-btn.active-light { background: var(--pace-light-bg); border-color: var(--pace-light-border); color: var(--pace-light-border); }
    .global-pace-btn.active-normal { background: var(--pace-normal-bg); border-color: var(--pace-normal-border); color: #a5b4fc; }
    .global-pace-btn.active-heavy { background: var(--pace-heavy-bg); border-color: var(--pace-heavy-border); color: var(--pace-heavy-border); }

    .today-card { background: rgba(15, 23, 42, 0.7); border: 1px solid var(--card-border); border-radius: 14px; padding: 16px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 12px; }
    .today-card:last-child { margin-bottom: 0; }
    .today-header { display: flex; justify-content: space-between; align-items: center; }
    .today-title { font-size: 1.1rem; font-weight: 700; color: #f1f5f9; }
    .today-pages-badge { font-size: 1.1rem; font-weight: 700; color: #38bdf8; background: rgba(56, 189, 248, 0.1); padding: 4px 12px; border-radius: 8px; border: 1px solid rgba(56, 189, 248, 0.3); }

    .btn-complete { width: 100%; padding: 10px; background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25); }
    .completed-badge { text-align: center; padding: 8px; color: var(--success); font-weight: 600; background: var(--success-light); border-radius: 8px; border: 1px solid rgba(16, 185, 129, 0.3); font-size: 0.9rem; }

    /* 管理エリア */
    .card { background: var(--card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--card-border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--text-muted); margin-bottom: 4px; }
    input { width: 100%; padding: 10px 12px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 10px; color: var(--text-main); font-size: 0.9rem; outline: none; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-primary { width: 100%; padding: 12px; background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; margin-top: 6px; }

    .manage-item { background: rgba(15, 23, 42, 0.5); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .manage-header { display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; }
    .btn-delete { background: none; border: none; color: #64748b; cursor: pointer; font-size: 1rem; }
    .btn-delete:hover { color: var(--danger); }
    .progress-bar-bg { background: rgba(15, 23, 42, 0.8); height: 6px; border-radius: 999px; overflow: hidden; margin: 6px 0; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #6366f1 0%, #a855f7 100%); }
    .manage-meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); }

    .empty-state { text-align: center; color: var(--text-muted); padding: 20px 0; font-size: 0.9rem; }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>StudyFlow</h1>
  </header>

  <!-- 自由な時間設定ができるリマインダーエリア -->
  <div class="notif-box">
    <span class="notif-title">🔔 毎日リマインダー</span>
    <div class="notif-controls">
      <input type="time" id="notifTime" class="time-input" value="20:00">
      <button class="btn-notif" onclick="saveAndScheduleNotification()">保存</button>
    </div>
  </div>

  <!-- 最上部：今日やるタスクエリア -->
  <div class="hero-section">
    <div class="section-title">🔥 今日の学習タスク</div>

    <div class="global-pace-box">
      <div class="pace-label">今日の気分・全体の学習量</div>
      <div class="global-pace-options">
        <button id="btnPaceLight" class="global-pace-btn" onclick="setGlobalPace('light')">🌙 少なめ</button>
        <button id="btnPaceNormal" class="global-pace-btn" onclick="setGlobalPace('normal')">⚡️ 普通</button>
        <button id="btnPaceHeavy" class="global-pace-btn" onclick="setGlobalPace('heavy')">🔥 多め</button>
      </div>
    </div>

    <div id="todayTaskList"></div>
  </div>

  <div class="card">
    <div class="section-title" style="font-size: 1rem; color: var(--text-muted);">📊 教材ごとの進捗状況</div>
    <div id="manageList"></div>
  </div>

  <div class="card">
    <div class="section-title" style="font-size: 1rem; color: var(--text-muted);">＋ 教材を追加する</div>
    <div class="form-group">
      <label>教材名</label>
      <input type="text" id="title" placeholder="例: システム英単語、数学チャート">
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label>現在のページ</label>
        <input type="number" id="currentP" value="1" min="1">
      </div>
      <div class="form-group">
        <label>目標ページ</label>
        <input type="number" id="targetP" placeholder="例: 150">
      </div>
    </div>
    <div class="form-group">
      <label>達成期限</label>
      <input type="date" id="deadline">
    </div>
    <button class="btn-primary" onclick="addSubject()">追加して計算する</button>
  </div>
</div>

<script>
  let subjects = JSON.parse(localStorage.getItem('studyflow_subjects') || '[]');
  let globalPace = localStorage.getItem('studyflow_global_pace') || 'normal';
  let notifTimerId = null;

  function getTodayString() { return new Date().toISOString().split('T')[0]; }
  
  function saveSubjects() {
    localStorage.setItem('studyflow_subjects', JSON.stringify(subjects));
    localStorage.setItem('studyflow_global_pace', globalPace);
  }

  function setGlobalPace(mode) {
    globalPace = mode;
    saveSubjects();
    render();
  }

  /* ユーザーが設定した時間にリマインダーをセット */
  function scheduleNotification() {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    if (notifTimerId) clearTimeout(notifTimerId);

    const savedTime = localStorage.getItem('studyflow_notif_time') || "20:00";
    document.getElementById('notifTime').value = savedTime;

    const [targetHour, targetMinute] = savedTime.split(':').map(Number);
    const now = new Date();
    const scheduledTime = new Date();
    scheduledTime.setHours(targetHour, targetMinute, 0, 0);

    if (now > scheduledTime) {
      scheduledTime.setDate(scheduledTime.getDate() + 1); // 過ぎている場合は翌日の同時刻
    }

    const timeUntilNotification = scheduledTime.getTime() - now.getTime();

    notifTimerId = setTimeout(() => {
      new Notification("StudyFlow", {
        body: "今日の学習タスクの時間です！進捗をチェックしましょう🔥",
        icon: "📚"
      });
      scheduleNotification();
    }, timeUntilNotification);
  }

  function saveAndScheduleNotification() {
    if (!("Notification" in window)) {
      alert("お使いのブラウザは通知に対応していません。");
      return;
    }

    Notification.requestPermission().then(permission => {
      if (permission === "granted") {
        const selectedTime = document.getElementById('notifTime').value;
        localStorage.setItem('studyflow_notif_time', selectedTime);
        alert(`毎日 ${selectedTime} にリマインダーを設定しました！`);
        scheduleNotification();
      } else {
        alert("通知が許可されませんでした。ブラウザの設定で通知を許可してください。");
      }
    });
  }

  function addSubject() {
    const title = document.getElementById('title').value.trim();
    const currentP = parseInt(document.getElementById('currentP').value);
    const targetP = parseInt(document.getElementById('targetP').value);
    const deadline = document.getElementById('deadline').value;

    if (!title || isNaN(currentP) || isNaN(targetP) || !deadline || currentP >= targetP) {
      alert('すべての項目を正確に入力してください。');
      return;
    }

    subjects.push({ id: Date.now(), title, currentP, targetP, deadline, completedDate: null });
    saveSubjects();
    render();
    document.getElementById('title').value = '';
    document.getElementById('targetP').value = '';
  }

  function deleteSubject(id) {
    if (confirm('この教材を削除しますか？')) {
      subjects = subjects.filter(s => s.id !== id);
      saveSubjects();
      render();
    }
  }

  function completeTodayTask(id, pagesToStudy) {
    const sub = subjects.find(s => s.id === id);
    if (sub) {
      sub.currentP = Math.min(sub.targetP, sub.currentP + pagesToStudy);
      sub.completedDate = getTodayString();
      saveSubjects();
      render();
    }
  }

  function calculatePacing(sub) {
    const today = new Date(); today.setHours(0,0,0,0);
    const deadDate = new Date(sub.deadline); deadDate.setHours(0,0,0,0);
    const remainingDays = Math.max(1, Math.ceil((deadDate - today) / (1000 * 60 * 60 * 24)));
    const remainingPages = Math.max(0, sub.targetP - sub.currentP + 1);

    if (remainingPages <= 0) return { remainingDays, todayPages: 0 };

    const standardPace = Math.ceil(remainingPages / remainingDays);
    let todayPages = standardPace;

    if (globalPace === 'light') todayPages = Math.max(1, Math.floor(standardPace * 0.6));
    else if (globalPace === 'heavy') todayPages = Math.ceil(standardPace * 1.5);

    return { remainingDays, todayPages: Math.min(remainingPages, todayPages) };
  }

  function updatePaceButtonsUI() {
    document.getElementById('btnPaceLight').className = 'global-pace-btn' + (globalPace === 'light' ? ' active-light' : '');
    document.getElementById('btnPaceNormal').className = 'global-pace-btn' + (globalPace === 'normal' ? ' active-normal' : '');
    document.getElementById('btnPaceHeavy').className = 'global-pace-btn' + (globalPace === 'heavy' ? ' active-heavy' : '');
  }

  function render() {
    updatePaceButtonsUI();
    const todayListEl = document.getElementById('todayTaskList');
    const manageListEl = document.getElementById('manageList');
    
    todayListEl.innerHTML = '';
    manageListEl.innerHTML = '';

    if (subjects.length === 0) {
      todayListEl.innerHTML = '<div class="empty-state">登録された教材がありません。<br>一番下のフォームから追加しましょう！</div>';
      manageListEl.innerHTML = '<div class="empty-state">データなし</div>';
      return;
    }

    const todayStr = getTodayString();

    subjects.forEach(sub => {
      const isCompletedToday = (sub.completedDate === todayStr);
      const isAllFinished = (sub.currentP >= sub.targetP);
      const { remainingDays, todayPages } = calculatePacing(sub);
      const progressPercent = Math.min(100, Math.round(((sub.currentP - 1) / sub.targetP) * 100));

      const todayStartP = sub.currentP;
      const todayEndP = Math.min(sub.targetP, todayStartP + todayPages - 1);

      const todayItem = document.createElement('div');
      todayItem.className = 'today-card';

      if (isAllFinished) {
        todayItem.innerHTML = `<div class="today-title">${sub.title}</div><div class="completed-badge">🎉 全ページ達成済み！</div>`;
      } else if (isCompletedToday) {
        todayItem.innerHTML = `<div class="today-title">${sub.title}</div><div class="completed-badge">✅ 本日の学習完了！</div>`;
      } else {
        todayItem.innerHTML = `
          <div class="today-header">
            <div class="today-title">${sub.title}</div>
            <div class="today-pages-badge">p.${todayStartP} 〜 ${todayEndP} (${todayPages}p)</div>
          </div>
          <button class="btn-complete" onclick="completeTodayTask(${sub.id}, ${todayPages})">完了する</button>
        `;
      }
      todayListEl.appendChild(todayItem);

      const manageItem = document.createElement('div');
      manageItem.className = 'manage-item';
      manageItem.innerHTML = `
        <div class="manage-header">
          <span>${sub.title}</span>
          <button class="btn-delete" onclick="deleteSubject(${sub.id})">✕</button>
        </div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${progressPercent}%"></div></div>
        <div class="manage-meta">
          <span>進捗: ${sub.currentP} / ${sub.targetP}p (${progressPercent}%)</span>
          <span>残り ${remainingDays} 日 (期限: ${sub.deadline})</span>
        </div>
      `;
      manageListEl.appendChild(manageItem);
    });
  }

  if ('serviceWorker' in navigator) {
    const swCode = `self.addEventListener('fetch', function(e) {});`;
    const blob = new Blob([swCode], { type: 'text/javascript' });
    const swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).catch(() => {});
  }

  scheduleNotification();

  const defaultDeadline = new Date();
  defaultDeadline.setDate(defaultDeadline.getDate() + 30);
  document.getElementById('deadline').value = defaultDeadline.toISOString().split('T')[0];
  render();
</script>

</body>
</html>
