<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyFlow</title>
  
  <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIlN0dWR5RmxvdyIsCiAgInNob3J0X25hbWUiOiAiU3R1ZHlGbG93IiwKICAic3RhcnRfdXJsIjogIi4vIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjZjhmYWZjIiwKICAidGhlbWVfY29sb3IiOiAiIzRhNjlmYSIsCiAgImljb25zIjogWwogICAgewogICAgICAic3JjIjogImRhdGE6aW1hZ2Uvc3ZnK3htbDt1dGY4LDxzdmcgeG1sbnM9J2h0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnJyB2aWV3Qm94PScwIDAgMTAwIDEwMCc+PHJlY3Qgd2lkdGg9JzEwMCcgaGVpZ2h0PScxMDAnIHJ4PScyMCcgZmlsbD0nIzRhNjlmYScvPjx0ZXh0IHg9JzUwJyB5PSc2NScgZm9udC1zaXplPSc1MCcgdGV4dC1hbmNob3I9J21pZGRsZSc+📚PC90ZXh0Pjwvc3ZnPiIsCiAgICAgICJzaXplcyI6ICI1MTJ4NTEyIiwKICAgICAgInR5cGUiOiAiaW1hZ2Uvc3ZnK3htbCIKICAgIH0KICBdCn0=">
  <meta name="theme-color" content="#4a69fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --primary: #4a69fa;
      --primary-light: #eef2ff;
      --border-color: #e2e8f0;
      --success: #10b981;
      --success-light: #ecfdf5;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif; }
    body { background: var(--bg-color); color: var(--text-main); min-height: 100vh; padding-bottom: 80px; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 600px; padding: 16px; }

    header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; padding-top: 8px; }
    header .logo-icon { background: #fef3c7; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    header .title-sub { font-size: 0.7rem; color: var(--text-muted); font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
    header h1 { font-size: 1.2rem; font-weight: 700; color: var(--text-main); }

    /* タブ切り替え制御 */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* カード・枠組み */
    .card { background: var(--card-bg); border-radius: 16px; padding: 20px; margin-bottom: 16px; border: 1px solid var(--border-color); box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    .card-subtitle { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .card-title { font-size: 1.1rem; font-weight: 700; color: var(--text-main); margin-bottom: 8px; }
    .card-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; }

    /* 今日のペース切り替えボタン */
    .pace-options { display: flex; gap: 8px; }
    .pace-btn { flex: 1; padding: 10px 4px; border-radius: 10px; border: 1px solid var(--border-color); background: #f8fafc; color: var(--text-muted); font-size: 0.8rem; font-weight: 700; cursor: pointer; text-align: center; }
    .pace-btn.active { background: var(--primary); border-color: var(--primary); color: white; }

    /* 今日のタスクカード */
    .today-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
    .today-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .today-title { font-size: 1rem; font-weight: 700; color: var(--text-main); }
    .today-badge { font-size: 0.85rem; font-weight: 700; color: var(--primary); background: var(--primary-light); padding: 4px 10px; border-radius: 6px; }
    .btn-complete { width: 100%; padding: 10px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
    .completed-badge { text-align: center; padding: 8px; color: var(--success); font-weight: 700; background: var(--success-light); border-radius: 8px; font-size: 0.85rem; }

    /* フォーム項目 */
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    input, select { width: 100%; padding: 12px; background: #f8fafc; border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-main); font-size: 0.9rem; outline: none; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-primary { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 8px; }

    /* 進捗管理 */
    .manage-item { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .manage-header { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 8px; }
    .btn-delete { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 1rem; }
    .progress-bar-bg { background: #f1f5f9; height: 8px; border-radius: 999px; overflow: hidden; margin: 8px 0; }
    .progress-bar-fill { height: 100%; background: var(--primary); border-radius: 999px; }
    .manage-meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); }

    /* 下部ナビゲーションバー */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: #ffffff;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      max-width: 600px;
      margin: 0 auto;
      z-index: 1000;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      gap: 3px;
    }
    .nav-item .icon { font-size: 1.2rem; }
    .nav-item.active { color: var(--primary); }

    .empty-state { text-align: center; color: var(--text-muted); padding: 30px 0; font-size: 0.9rem; }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="logo-icon">🎓</div>
    <div>
      <div class="title-sub">STUDYFLOW</div>
      <h1>毎日の勉強ナビ</h1>
    </div>
  </header>

  <!-- タブ1: 今日 -->
  <div id="tab-today" class="tab-content active">
    <div class="card">
      <div class="card-subtitle">TODAY'S CONDITION</div>
      <div class="card-title">今日はどれくらいできそう？</div>
      <div class="card-desc">気分や体調に合わせて選べます。少なめでも続けることが大切です。</div>
      <div class="pace-options">
        <button id="btnPaceLight" class="pace-btn" onclick="setGlobalPace('light')">少なめ</button>
        <button id="btnPaceNormal" class="pace-btn" onclick="setGlobalPace('normal')">普通（基本）</button>
        <button id="btnPaceHeavy" class="pace-btn" onclick="setGlobalPace('heavy')">多め</button>
      </div>
    </div>

    <div class="card-subtitle" style="margin-left: 4px; margin-bottom: 8px;">DAILY PLAN</div>
    <div id="todayTaskList"></div>
  </div>

  <!-- タブ2: 進捗 -->
  <div id="tab-progress" class="tab-content">
    <div class="card-subtitle" style="margin-left: 4px; margin-bottom: 8px;">PROGRESS</div>
    <div id="manageList"></div>
  </div>

  <!-- タブ3: 教材追加 -->
  <div id="tab-add" class="tab-content">
    <div class="card">
      <div class="card-title">新しい教材を追加</div>
      <div class="form-group">
        <label>教材名</label>
        <input type="text" id="title" placeholder="例: システム英単語">
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>現在のページ</label>
          <input type="number" id="currentP" value="1" min="1">
        </div>
        <div class="form-group">
          <label>目標ページ</label>
          <input type="number" id="targetP" placeholder="例: 150">
        </div>
      </div>
      <div class="form-group">
        <label>達成期限</label>
        <input type="date" id="deadline">
      </div>
      <button class="btn-primary" onclick="addSubject()">追加して計算する</button>
    </div>
  </div>

  <!-- タブ4: 設定 -->
  <div id="tab-settings" class="tab-content">
    <div class="card">
      <div class="card-title">🔔 リマインダー設定</div>
      <div class="card-desc">指定した時間に毎日の学習タスクをお知らせします。</div>
      <div class="form-group">
        <label>通知時刻</label>
        <input type="time" id="notifTime" value="20:00">
      </div>
      <button class="btn-primary" onclick="saveAndScheduleNotification()">設定を保存する</button>
    </div>
  </div>
</div>

<!-- 下部ナビゲーションバー -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="switchTab('today', this)">
    <span class="icon">📝</span>
    <span>今日</span>
  </div>
  <div class="nav-item" onclick="switchTab('progress', this)">
    <span class="icon">📊</span>
    <span>進捗</span>
  </div>
  <div class="nav-item" onclick="switchTab('add', this)">
    <span class="icon">➕</span>
    <span>追加</span>
  </div>
  <div class="nav-item" onclick="switchTab('settings', this)">
    <span class="icon">⚙️</span>
    <span>設定</span>
  </div>
</div>

<script>
  let subjects = JSON.parse(localStorage.getItem('studyflow_subjects') || '[]');
  let globalPace = localStorage.getItem('studyflow_global_pace') || 'normal';
  let notifTimerId = null;

  function getTodayString() { return new Date().toISOString().split('T')[0]; }
  
  function saveSubjects() {
    localStorage.setItem('studyflow_subjects', JSON.stringify(subjects));
    localStorage.setItem('studyflow_global_pace', globalPace);
  }

  function switchTab(tabName, el) {
    document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
    document.getElementById('tab-' + tabName).classList.add('active');
    el.classList.add('active');
  }

  function setGlobalPace(mode) {
    globalPace = mode;
    saveSubjects();
    render();
  }

  function scheduleNotification() {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    if (notifTimerId) clearTimeout(notifTimerId);

    const savedTime = localStorage.getItem('studyflow_notif_time') || "20:00";
    document.getElementById('notifTime').value = savedTime;

    const [targetHour, targetMinute] = savedTime.split(':').map(Number);
    const now = new Date();
    const scheduledTime = new Date();
    scheduledTime.setHours(targetHour, targetMinute, 0, 0);

    if (now > scheduledTime) {
      scheduledTime.setDate(scheduledTime.getDate() + 1);
    }

    const timeUntilNotification = scheduledTime.getTime() - now.getTime();

    notifTimerId = setTimeout(() => {
      new Notification("StudyFlow", {
        body: "今日の学習タスクの時間です！進捗をチェックしましょう🔥",
        icon: "📚"
      });
      scheduleNotification();
    }, timeUntilNotification);
  }

  function saveAndScheduleNotification() {
    if (!("Notification" in window)) {
      alert("お使いのブラウザは通知に対応していません。");
      return;
    }

    Notification.requestPermission().then(permission => {
      if (permission === "granted") {
        const selectedTime = document.getElementById('notifTime').value;
        localStorage.setItem('studyflow_notif_time', selectedTime);
        alert(`毎日 ${selectedTime} にリマインダーを設定しました！`);
        scheduleNotification();
      } else {
        alert("通知が許可されませんでした。");
      }
    });
  }

  function addSubject() {
    const title = document.getElementById('title').value.trim();
    const currentP = parseInt(document.getElementById('currentP').value);
    const targetP = parseInt(document.getElementById('targetP').value);
    const deadline = document.getElementById('deadline').value;

    if (!title || isNaN(currentP) || isNaN(targetP) || !deadline || currentP >= targetP) {
      alert('すべての項目を正確に入力してください。');
      return;
    }

    subjects.push({ id: Date.now(), title, currentP, targetP, deadline, completedDate: null });
    saveSubjects();
    render();
    document.getElementById('title').value = '';
    document.getElementById('targetP').value = '';
    
    // 追加完了後に進捗タブへ自動移動
    switchTab('progress', document.querySelectorAll('.nav-item')[1]);
  }

  function deleteSubject(id) {
    if (confirm('この教材を削除しますか？')) {
      subjects = subjects.filter(s => s.id !== id);
      saveSubjects();
      render();
    }
  }

  function completeTodayTask(id, pagesToStudy) {
    const sub = subjects.find(s => s.id === id);
    if (sub) {
      sub.currentP = Math.min(sub.targetP, sub.currentP + pagesToStudy);
      sub.completedDate = getTodayString();
      saveSubjects();
      render();
    }
  }

  function calculatePacing(sub) {
    const today = new Date(); today.setHours(0,0,0,0);
    const deadDate = new Date(sub.deadline); deadDate.setHours(0,0,0,0);
    const remainingDays = Math.max(1, Math.ceil((deadDate - today) / (1000 * 60 * 60 * 24)));
    const remainingPages = Math.max(0, sub.targetP - sub.currentP + 1);

    if (remainingPages <= 0) return { remainingDays, todayPages: 0 };

    const standardPace = Math.ceil(remainingPages / remainingDays);
    let todayPages = standardPace;

    if (globalPace === 'light') todayPages = Math.max(1, Math.floor(standardPace * 0.6));
    else if (globalPace === 'heavy') todayPages = Math.ceil(standardPace * 1.5);

    return { remainingDays, todayPages: Math.min(remainingPages, todayPages) };
  }

  function updatePaceButtonsUI() {
    document.getElementById('btnPaceLight').className = 'pace-btn' + (globalPace === 'light' ? ' active' : '');
    document.getElementById('btnPaceNormal').className = 'pace-btn' + (globalPace === 'normal' ? ' active' : '');
    document.getElementById('btnPaceHeavy').className = 'pace-btn' + (globalPace === 'heavy' ? ' active' : '');
  }

  function render() {
    updatePaceButtonsUI();
    const todayListEl = document.getElementById('todayTaskList');
    const manageListEl = document.getElementById('manageList');
    
    todayListEl.innerHTML = '';
    manageListEl.innerHTML = '';

    if (subjects.length === 0) {
      todayListEl.innerHTML = '<div class="empty-state">登録された教材がありません。<br>「追加」タブから登録してみましょう！</div>';
      manageListEl.innerHTML = '<div class="empty-state">登録された教材がありません。</div>';
      return;
    }

    const todayStr = getTodayString();

    subjects.forEach(sub => {
      const isCompletedToday = (sub.completedDate === todayStr);
      const isAllFinished = (sub.currentP >= sub.targetP);
      const { remainingDays, todayPages } = calculatePacing(sub);
      const progressPercent = Math.min(100, Math.round(((sub.currentP - 1) / sub.targetP) * 100));

      const todayStartP = sub.currentP;
      const todayEndP = Math.min(sub.targetP, todayStartP + todayPages - 1);

      const todayItem = document.createElement('div');
      todayItem.className = 'today-card';

      if (isAllFinished) {
        todayItem.innerHTML = `<div class="today-title">${sub.title}</div><div class="completed-badge">🎉 全ページ達成済み！</div>`;
      } else if (isCompletedToday) {
        todayItem.innerHTML = `<div class="today-title">${sub.title}</div><div class="completed-badge">✅ 本日の学習完了！</div>`;
      } else {
        todayItem.innerHTML = `
          <div class="today-header">
            <div class="today-title">${sub.title}</div>
            <div class="today-badge">p.${todayStartP} 〜 ${todayEndP} (${todayPages}p)</div>
          </div>
          <button class="btn-complete" onclick="completeTodayTask(${sub.id}, ${todayPages})">完了する</button>
        `;
      }
      todayListEl.appendChild(todayItem);

      const manageItem = document.createElement('div');
      manageItem.className = 'manage-item';
      manageItem.innerHTML = `
        <div class="manage-header">
          <span>${sub.title}</span>
          <button class="btn-delete" onclick="deleteSubject(${sub.id})">✕</button>
        </div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${progressPercent}%"></div></div>
        <div class="manage-meta">
          <span>進捗: ${sub.currentP} / ${sub.targetP}p (${progressPercent}%)</span>
          <span>残り ${remainingDays} 日</span>
        </div>
      `;
      manageListEl.appendChild(manageItem);
    });
  }

  if ('serviceWorker' in navigator) {
    const swCode = `self.addEventListener('fetch', function(e) {});`;
    const blob = new Blob([swCode], { type: 'text/javascript' });
    const swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).catch(() => {});
  }

  scheduleNotification();

  const defaultDeadline = new Date();
  defaultDeadline.setDate(defaultDeadline.getDate() + 30);
  document.getElementById('deadline').value = defaultDeadline.toISOString().split('T')[0];
  render();
</script>

</body>
</html>
