<head>

  <style>
    :root {
      /* デフォルト: ライトモード */
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --input-bg: #f8fafc;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --primary: #4a69fa;
      --primary-light: #eef2ff;
      --border-color: #e2e8f0;
      --success: #10b981;
      --success-light: #ecfdf5;
      --nav-bg: #ffffff;
      --card-radius: 16px;
      --cat-ear-display: none;
      --badge-bg: #e0e7ff;
      --badge-text: #3730a3;
    }

    /* ダークモード */
    body.theme-dark {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --input-bg: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-light: rgba(99, 102, 241, 0.2);
      --border-color: #334155;
      --success: #34d399;
      --success-light: rgba(52, 211, 153, 0.15);
      --nav-bg: #1e293b;
      --cat-ear-display: none;
      --badge-bg: #312e81;
      --badge-text: #c7d2fe;
    }

    /* ネコモチーフモード 🐾 */
    body.theme-cat {
      --bg-color: #fff7ed;
      --card-bg: #ffffff;
      --input-bg: #fff1f2;
      --text-main: #431407;
      --text-muted: #9a3412;
      --primary: #fb923c;
      --primary-light: #ffedd5;
      --border-color: #fed7aa;
      --success: #f43f5e;
      --success-light: #ffe4e6;
      --nav-bg: #ffffff;
      --card-radius: 20px;
      --cat-ear-display: block;
      --badge-bg: #ffedd5;
      --badge-text: #9a3412;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif; transition: background-color 0.2s, color 0.2s, border-color 0.2s; }
    body { background: var(--bg-color); color: var(--text-main); min-height: 100vh; padding-bottom: 90px; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 600px; padding: 16px; }

    header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding-top: 8px; }
    header .logo-icon { background: #fef3c7; width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; }
    header .title-sub { font-size: 0.7rem; color: var(--text-muted); font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
    header h1 { font-size: 1.2rem; font-weight: 700; color: var(--text-main); }

    /* タブ切り替え */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* カード・コンテナ */
    .card { position: relative; background: var(--card-bg); border-radius: var(--card-radius); padding: 18px; margin-bottom: 16px; border: 1px solid var(--border-color); box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    
    .card::before {
      content: '🐾';
      display: var(--cat-ear-display);
      position: absolute;
      top: -12px;
      right: 20px;
      font-size: 1.1rem;
    }

    .card-subtitle { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .card-title { font-size: 1.1rem; font-weight: 700; color: var(--text-main); margin-bottom: 8px; }
    .card-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 14px; line-height: 1.4; }

    /* ペース・テーマ選択ボタン */
    .options-grid { display: flex; gap: 8px; }
    .opt-btn { flex: 1; padding: 10px 4px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-muted); font-size: 0.8rem; font-weight: 700; cursor: pointer; text-align: center; }
    .opt-btn.active { background: var(--primary); border-color: var(--primary); color: white; }
    /* 今日のタスクカード */
    .today-card { position: relative; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--card-radius); padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
    .today-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .subject-tag { font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 4px; background: var(--badge-bg); color: var(--badge-text); display: inline-block; margin-bottom: 4px; }
    .today-title { font-size: 1rem; font-weight: 700; color: var(--text-main); }
    .today-badge { font-size: 0.85rem; font-weight: 700; color: var(--primary); background: var(--primary-light); padding: 4px 10px; border-radius: 6px; white-space: nowrap; }
    
    .method-desc { font-size: 0.82rem; color: var(--text-muted); background: var(--input-bg); padding: 8px 12px; border-radius: 8px; margin: 8px 0 12px 0; border-left: 3px solid var(--primary); }

    .action-group { display: flex; gap: 8px; }
    .btn-complete { flex: 2; padding: 10px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: transform 0.1s; }
    .btn-complete:active { transform: scale(0.98); }
    .btn-partial { flex: 1; padding: 10px; background: var(--input-bg); color: var(--text-muted); border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
    
    .completed-box { text-align: center; padding: 12px; background: var(--success-light); border-radius: 10px; border: 1px solid rgba(16, 185, 129, 0.2); }
    .completed-badge { color: var(--success); font-weight: 700; font-size: 0.9rem; margin-bottom: 8px; }
    .completed-actions { display: flex; justify-content: center; gap: 8px; }
    .btn-more { padding: 6px 12px; background: var(--card-bg); color: var(--success); border: 1px solid var(--success); border-radius: 6px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
    .btn-undo { padding: 6px 12px; background: var(--card-bg); color: var(--text-muted); border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }

    /* フォーム・リスト */
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    input, select { width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-main); font-size: 0.9rem; outline: none; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-primary { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 8px; }

    /* 進捗表示 */
    .manage-item { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--card-radius); padding: 14px 16px; margin-bottom: 10px; }
    .manage-header { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 6px; font-size: 0.95rem; }
    .progress-bar-bg { background: var(--input-bg); height: 8px; border-radius: 999px; overflow: hidden; margin: 6px 0; }
    .progress-bar-fill { height: 100%; background: var(--primary); border-radius: 999px; }
    .manage-meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); }

    /* ナビゲーション */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: var(--nav-bg); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; max-width: 600px; margin: 0 auto; z-index: 1000; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); font-size: 0.7rem; font-weight: 700; cursor: pointer; gap: 3px; }
    .nav-item .icon { font-size: 1.2rem; }
    .nav-item.active { color: var(--primary); }

    .empty-state { text-align: center; color: var(--text-muted); padding: 30px 0; font-size: 0.9rem; }
    .info-banner { background: var(--primary-light); border: 1px solid var(--primary); color: var(--primary); padding: 10px 14px; border-radius: 10px; font-size: 0.8rem; font-weight: 700; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="logo-icon" id="appLogo">🎓</div>
    <div>
      <div class="title-sub" id="appSubTitle">TERM-END EXAM ROADMAP</div>
      <h1 id="appTitle">期末テスト完全攻略ナビ</h1>
    </div>
  </header>

  <!-- 今日のカウントダウン -->
  <div class="info-banner">
    <span id="countdownText">🎯 2/12 期末テストまであと -- 日</span>
    <span id="currentWeekText" style="font-size: 0.75rem; opacity: 0.8;"></span>
  </div>

  <!-- タブ1: 今日のタスク -->
  <div id="tab-today" class="tab-content active">
    <div class="card">
      <div class="card-subtitle">TODAY'S PACE</div>
      <div class="card-title">今日の調子は？</div>
      <div class="options-grid">
        <button id="btnPaceLight" class="opt-btn" onclick="setGlobalPace('light')">少なめ</button>
        <button id="btnPaceNormal" class="opt-btn" onclick="setGlobalPace('normal')">普通（標準）</button>
        <button id="btnPaceHeavy" class="opt-btn" onclick="setGlobalPace('heavy')">多め</button>
      </div>
    </div>

    <div class="card-subtitle" style="margin-left: 4px; margin-bottom: 8px;">TODAY'S TASKS</div>
    <div id="todayTaskList"></div>
  </div>

  <!-- タブ2: 学習ロードマップ（全計画） -->
  <div id="tab-progress" class="tab-content">
    <div class="card-subtitle" style="margin-left: 4px; margin-bottom: 8px;">OVERALL PROGRESS</div>
    <div id="manageList"></div>
  </div>

  <!-- タブ3: 設定 -->
  <div id="tab-settings" class="tab-content">
    <div class="card">
      <div class="card-title">🎨 テーマ切り替え</div>
      <div class="card-desc">デザインを選択できます。</div>
      <div class="options-grid">
        <button id="btnThemeLight" class="opt-btn" onclick="setTheme('light')">☀️ ライト</button>
        <button id="btnThemeDark" class="opt-btn" onclick="setTheme('dark')">🌙 ダーク</button>
        <button id="btnThemeCat" class="opt-btn" onclick="setTheme('cat')">🐾 ネコ</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">🔔 リマインダー設定</div>
      <div class="card-desc">毎日の学習時間をお知らせします。</div>
      <div class="form-group">
        <label>通知時刻</label>
        <input type="time" id="notifTime" value="20:00">
      </div>
      <button class="btn-primary" onclick="saveAndScheduleNotification()">設定を保存する</button>
    </div>
  </div>
</div>

<!-- 下部ナビゲーション -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="switchTab('today', this)">
    <span class="icon">📝</span>
    <span>今日のタスク</span>
  </div>
  <div class="nav-item" onclick="switchTab('progress', this)">
    <span class="icon">📊</span>
    <span>進捗と計画</span>
  </div>
  <div class="nav-item" onclick="switchTab('settings', this)">
    <span class="icon">⚙️</span>
    <span>設定</span>
  </div>
</div>
<script>
  // 期末テスト計画用データ定義
  const MASTER_PLAN = [
    // 9月
    { id: '9-2-ja', weekId: '2026-W37', month: '9月第2週', subject: '国語', title: '国語ワーク', startP: 4, endP: 12, method: '📖 教科書の既習文章の漢字・語句を確認しながらワークを解く' },
    { id: '9-2-ma', weekId: '2026-W37', month: '9月第2週', subject: '数学', title: '数学ワーク', startP: 14, endP: 20, method: '✍️ 計算問題の基礎を確実に解く' },
    { id: '9-2-sc', weekId: '2026-W37', month: '9月第2週', subject: '理科', title: '理科ワーク', startP: 10, endP: 16, method: '📖 教科書インプット＋基本確認問題を解く' },
    { id: '9-2-en', weekId: '2026-W37', month: '9月第2週', subject: '英語', title: '英語ワーク', startP: 2, endP: 10, method: '🔤 単語暗記＋基本文法の確認' },
    { id: '9-2-so', weekId: '2026-W37', month: '9月第2週', subject: '社会', title: '社会(地理)☆問題集', startP: 4, endP: 10, method: '📖 教科書を読む ➔ 閉じて要点確認 ➔ ☆問題集を解く' },

    { id: '9-3-ja', weekId: '2026-W38', month: '9月第3週', subject: '国語', title: '国語ワーク', startP: 13, endP: 20, method: '✍️ ワーク演習＋間違えた問題に×印をつける' },
    { id: '9-3-ma', weekId: '2026-W38', month: '9月第3週', subject: '数学', title: '数学ワーク', startP: 21, endP: 28, method: '✍️ 途中式を丁寧に書いて解く' },
    { id: '9-3-sc', weekId: '2026-W38', month: '9月第3週', subject: '理科', title: '理科ワーク＆☆', startP: 17, endP: 24, method: '📖 教科書確認＋ワーク(17~24p)と理科☆(6~12p)を並行' },
    { id: '9-3-en', weekId: '2026-W38', month: '9月第3週', subject: '英語', title: '英語ワーク＆☆', startP: 11, endP: 20, method: '🔤 ワーク(11~20p)＋英語☆(4~10p)を解く' },
    { id: '9-3-so', weekId: '2026-W38', month: '9月第3週', subject: '社会', title: '社会(歴史)☆問題集', startP: 1, endP: 10, method: '📖 教科書で流れを把握 ➔ ☆問題集を解く' },

    { id: '9-4-ja', weekId: '2026-W39', month: '9月第4週', subject: '国語', title: '国語ワーク', startP: 21, endP: 30, method: '✍️ 読解・語句問題の演習' },
    { id: '9-4-ma', weekId: '2026-W39', month: '9月第4週', subject: '数学', title: '数学ワーク', startP: 29, endP: 36, method: '✍️ 基本〜標準問題の演習' },
    { id: '9-4-sc', weekId: '2026-W39', month: '9月第4週', subject: '理科', title: '理科ワーク＆☆', startP: 25, endP: 32, method: '✍️ ワーク(25~32p)＋理科☆(13~20p)' },
    { id: '9-4-en', weekId: '2026-W39', month: '9月第4週', subject: '英語', title: '英語ワーク＆☆', startP: 21, endP: 30, method: '✍️ ワーク(21~30p)＋英語☆(11~18p)' },
    { id: '9-4-so', weekId: '2026-W39', month: '9月第4週', subject: '社会', title: '社会(地理)☆問題集', startP: 11, endP: 20, method: '📖 地図・資料を確認しながら問題集を解く' },

    { id: '9-5-rev', weekId: '2026-W40', month: '9月最終', subject: '全教科', title: '9月のミス問題総解き直し', startP: 1, endP: 1, method: '🔄 9月に解いた全問題の「×（間違えた問題）」のみ解き直す！' },
  ];

  let taskProgress = JSON.parse(localStorage.getItem('studyflow_plan_progress') || '{}');
  let globalPace = localStorage.getItem('studyflow_global_pace') || 'normal';
  let currentTheme = localStorage.getItem('studyflow_theme') || 'light';
  let notifTimerId = null;

  function getTodayString() { return new Date().toISOString().split('T')[0]; }

  function saveData() {
    localStorage.setItem('studyflow_plan_progress', JSON.stringify(taskProgress));
    localStorage.setItem('studyflow_global_pace', globalPace);
    localStorage.setItem('studyflow_theme', currentTheme);
  }

  /* テーマ設定（不具合修正済み） */
  function setTheme(theme) {
    currentTheme = theme;
    document.body.className = '';
    
    if (theme === 'dark') {
      document.body.classList.add('theme-dark');
      document.getElementById('appLogo').textContent = '🎓';
      document.getElementById('appSubTitle').textContent = 'TERM-END EXAM ROADMAP';
      document.getElementById('appTitle').textContent = '期末テスト完全攻略ナビ';
    } else if (theme === 'cat') {
      document.body.classList.add('theme-cat');
      document.getElementById('appLogo').textContent = '🐾';
      document.getElementById('appSubTitle').textContent = 'NYAN STUDY FLOW';
      document.getElementById('appTitle').textContent = 'ニャンと期末テスト攻略ナビ';
    } else {
      document.getElementById('appLogo').textContent = '🎓';
      document.getElementById('appSubTitle').textContent = 'TERM-END EXAM ROADMAP';
      document.getElementById('appTitle').textContent = '期末テスト完全攻略ナビ';
    }

    saveData();
    updateThemeButtonsUI();
    render(); // テキスト切り替えを即時反映
  }

  function updateThemeButtonsUI() {
    document.getElementById('btnThemeLight').className = 'opt-btn' + (currentTheme === 'light' ? ' active' : '');
    document.getElementById('btnThemeDark').className = 'opt-btn' + (currentTheme === 'dark' ? ' active' : '');
    document.getElementById('btnThemeCat').className = 'opt-btn' + (currentTheme === 'cat' ? ' active' : '');
  }

  function fireConfetti() {
    if (typeof confetti === 'function') {
      confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
    }
  }

  function switchTab(tabName, el) {
    document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
    document.getElementById('tab-' + tabName).classList.add('active');
    el.classList.add('active');
  }

  function setGlobalPace(mode) {
    globalPace = mode;
    saveData();
    render();
  }

  function completeTask(taskId) {
    taskProgress[taskId] = { status: 'completed', date: getTodayString() };
    saveData();
    fireConfetti();
    render();
  }

  function undoTask(taskId) {
    delete taskProgress[taskId];
    saveData();
    render();
  }

  function updatePaceButtonsUI() {
    document.getElementById('btnPaceLight').className = 'opt-btn' + (globalPace === 'light' ? ' active' : '');
    document.getElementById('btnPaceNormal').className = 'opt-btn' + (globalPace === 'normal' ? ' active' : '');
    document.getElementById('btnPaceHeavy').className = 'opt-btn' + (globalPace === 'heavy' ? ' active' : '');
  }

  function renderCountdown() {
    const today = new Date();
    const examDate = new Date('2027-02-12');
    const diffTime = examDate - today;
    const diffDays = Math.max(0, Math.ceil(diffTime / (1000 * 60 * 60 * 24)));
    
    document.getElementById('countdownText').textContent = `🎯 2/12 期末テストまであと ${diffDays} 日`;
  }

  function render() {
    updatePaceButtonsUI();
    updateThemeButtonsUI();
    renderCountdown();

    const todayListEl = document.getElementById('todayTaskList');
    const manageListEl = document.getElementById('manageList');
    
    todayListEl.innerHTML = '';
    manageListEl.innerHTML = '';

    const catDecor = currentTheme === 'cat' ? '🐾 ' : '';
    const completeBtnText = currentTheme === 'cat' ? '目標達成だニャ！' : '目標達成！';

    // 1. 今日のタスク一覧の描画
    MASTER_PLAN.forEach(task => {
      const prog = taskProgress[task.id] || {};
      const isDone = prog.status === 'completed';

      let displayPages = `${task.startP}〜${task.endP}p`;
      if (task.startP === task.endP) displayPages = `${task.startP}p`;

      const taskCard = document.createElement('div');
      taskCard.className = 'today-card';

      if (isDone) {
        taskCard.innerHTML = `
          <div class="today-header">
            <div>
              <span class="subject-tag">${task.subject}</span>
              <div class="today-title">${task.title}</div>
            </div>
          </div>
          <div class="completed-box">
            <div class="completed-badge">✅ ${catDecor}達成済み！（${displayPages}）</div>
            <div class="completed-actions">
              <button class="btn-undo" onclick="undoTask('${task.id}')">取り消す</button>
            </div>
          </div>
        `;
      } else {
        taskCard.innerHTML = `
          <div class="today-header">
            <div>
              <span class="subject-tag">${task.subject}</span>
              <div class="today-title">${task.title}</div>
            </div>
            <div class="today-badge">${displayPages}</div>
          </div>
          <div class="method-desc">${task.method}</div>
          <div class="action-group">
            <button class="btn-complete" onclick="completeTask('${task.id}')">${completeBtnText}</button>
          </div>
        `;
      }
      todayListEl.appendChild(taskCard);
    });

    // 2. 全体進捗ビューの描画
    let totalTasks = MASTER_PLAN.length;
    let completedCount = Object.keys(taskProgress).length;
    let overallPercent = Math.round((completedCount / totalTasks) * 100);

    const overallCard = document.createElement('div');
    overallCard.className = 'card';
    overallCard.innerHTML = `
      <div class="card-subtitle">TOTAL PROGRESS</div>
      <div class="card-title">9月の学習計画 達成度</div>
      <div class="progress-bar-bg" style="height: 12px;"><div class="progress-bar-fill" style="width: ${overallPercent}%"></div></div>
      <div class="manage-meta" style="margin-top: 8px;">
        <span>完了: ${completedCount} / ${totalTasks} タスク</span>
        <span><b>${overallPercent}% 達成</b></span>
      </div>
    `;
    manageListEl.appendChild(overallCard);
  }

  function saveAndScheduleNotification() {
    if (!("Notification" in window)) {
      alert("お使いのブラウザは通知に対応していません。");
      return;
    }
    Notification.requestPermission().then(permission => {
      if (permission === "granted") {
        const selectedTime = document.getElementById('notifTime').value;
        localStorage.setItem('studyflow_notif_time', selectedTime);
        alert(`毎日 ${selectedTime} にリマインダーを設定しました！`);
      }
    });
  }

  if ('serviceWorker' in navigator) {
    const swCode = `self.addEventListener('fetch', function(e) {});`;
    const blob = new Blob([swCode], { type: 'text/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
  }

  setTheme(currentTheme);
  render();
</script>

</body>
</html>
