      --text-main: #431407;

</head>

  let completedTasks = JSON.parse(localStorage.getItem('studyflow_completed_v2') || '{}');
  let globalPace = localStorage.getItem('studyflow_global_pace') || 'normal';
  let currentTheme = localStorage.getItem('studyflow_theme') || 'light';
  let notifTimerId = null;

  function getTodayString() {
    const d = new Date();
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function saveState() {
    localStorage.setItem('studyflow_completed_v2', JSON.stringify(completedTasks));
    localStorage.setItem('studyflow_global_pace', globalPace);
    localStorage.setItem('studyflow_theme', currentTheme);
  }

  /* テーマ設定（文字差し替えバグ修正済み） */
  function setTheme(theme) {
    currentTheme = theme;
    document.body.className = '';
    
    if (theme === 'dark') {
      document.body.classList.add('theme-dark');
      document.getElementById('appLogo').textContent = '🎓';
      document.getElementById('appTitle').textContent = '毎日の勉強ナビ';
    } else if (theme === 'cat') {
      document.body.classList.add('theme-cat');
      document.getElementById('appLogo').textContent = '🐾';
      document.getElementById('appTitle').textContent = 'ニャンと勉強ナビ';
    } else {
      document.getElementById('appLogo').textContent = '🎓';
      document.getElementById('appTitle').textContent = '毎日の勉強ナビ';
    }

    saveState();
    render();
  }

  function updateThemeButtonsUI() {
    document.getElementById('btnThemeLight').className = 'opt-btn' + (currentTheme === 'light' ? ' active' : '');
    document.getElementById('btnThemeDark').className = 'opt-btn' + (currentTheme === 'dark' ? ' active' : '');
    document.getElementById('btnThemeCat').className = 'opt-btn' + (currentTheme === 'cat' ? ' active' : '');
  }

  function fireConfetti() {
    if (typeof confetti === 'function') {
      confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
    }
  }

  function switchTab(tabName, el) {
    document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
    document.getElementById('tab-' + tabName).classList.add('active');
    el.classList.add('active');
  }

  function setGlobalPace(mode) {
    globalPace = mode;
    saveState();
    render();
  }

  function scheduleNotification() {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    if (notifTimerId) clearTimeout(notifTimerId);

    const savedTime = localStorage.getItem('studyflow_notif_time') || "20:00";
    document.getElementById('notifTime').value = savedTime;

    const [targetHour, targetMinute] = savedTime.split(':').map(Number);
    const now = new Date();
    const scheduledTime = new Date();
    scheduledTime.setHours(targetHour, targetMinute, 0, 0);

    if (now > scheduledTime) {
      scheduledTime.setDate(scheduledTime.getDate() + 1);
    }

    const timeUntilNotification = scheduledTime.getTime() - now.getTime();

    notifTimerId = setTimeout(() => {
      new Notification("StudyFlow", {
        body: currentTheme === 'cat' ? "今日の勉強タイムだニャン！🐾" : "今日の学習タスクの時間です！進捗をチェックしましょう🔥",
        icon: "📚"
      });
      scheduleNotification();
    }, timeUntilNotification);
  }

  function saveAndScheduleNotification() {
    if (!("Notification" in window)) {
      alert("お使いのブラウザは通知に対応していません。");
      return;
    }

    Notification.requestPermission().then(permission => {
      if (permission === "granted") {
        const selectedTime = document.getElementById('notifTime').value;
        localStorage.setItem('studyflow_notif_time', selectedTime);
        alert(`毎日 ${selectedTime} にリマインダーを設定しました！`);
        scheduleNotification();
      } else {
        alert("通知が許可されませんでした。");
      }
    });
  }

  function toggleTaskComplete(taskId) {
    const today = getTodayString();
    if (completedTasks[taskId] === today) {
      delete completedTasks[taskId];
    } else {
      completedTasks[taskId] = today;
      fireConfetti();
    }
    saveState();
    render();
  }

  function getCurrentWeekPlan() {
    const today = getTodayString();
    let current = masterSchedule.find(w => today >= w.start && today <= w.end);
    if (!current) {
      current = masterSchedule[0]; // デフォルト
    }
    return current;
  }

  function updatePaceButtonsUI() {
    document.getElementById('btnPaceLight').className = 'opt-btn' + (globalPace === 'light' ? ' active' : '');
    document.getElementById('btnPaceNormal').className = 'opt-btn' + (globalPace === 'normal' ? ' active' : '');
    document.getElementById('btnPaceHeavy').className = 'opt-btn' + (globalPace === 'heavy' ? ' active' : '');
  }

  function render() {
    updatePaceButtonsUI();
    updateThemeButtonsUI();

    const todayStr = getTodayString();
    const d = new Date();
    const days = ['日','月','火','水','木','金','土'];
    document.getElementById('currentDateStr').textContent = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日(${days[d.getDay()]})`;

    const currentWeek = getCurrentWeekPlan();
    document.getElementById('currentWeekStr').textContent = currentWeek.label;

    // 1. 今日のタスク一覧の描画（今日やるべきことのみを表示）
    const todayListEl = document.getElementById('todayTaskList');
    todayListEl.innerHTML = '';

    currentWeek.tasks.forEach((t, index) => {
      const taskId = `${currentWeek.id}_${index}`;
      const isDone = (completedTasks[taskId] === todayStr);

      const card = document.createElement('div');
      card.className = 'subject-card';
      card.setAttribute('data-subject', t.subject);

      const completeBtnText = currentTheme === 'cat' ? '目標達成だニャ！ 🐾' : '目標達成！';
      const completedBadgeText = currentTheme === 'cat' ? '✅ 本日の学習完了だニャ！ 🐾' : '✅ 本日の学習完了！';

      if (isDone) {
        card.innerHTML = `
          <div class="subj-header">
            <span class="subj-badge">${t.subject}</span>
            <span class="subj-material-name">${t.material}</span>
          </div>
          <div class="completed-box">
            <div class="completed-badge">${completedBadgeText}</div>
            <button class="btn-undo" onclick="toggleTaskComplete('${taskId}')">取り消す</button>
          </div>
        `;
      } else {
        card.innerHTML = `
          <div class="subj-header">
            <span class="subj-badge">${t.subject}</span>
            <span class="subj-material-name">${t.material}</span>
          </div>
          <div class="subj-action-title">目安: ${t.target}</div>
          <div class="subj-instruction">${t.action}</div>
          <button class="btn-complete" onclick="toggleTaskComplete('${taskId}')">${completeBtnText}</button>
        `;
      }
      todayListEl.appendChild(card);
    });

    // 2. 22週間ロードマップ一覧の描画
    const timelineEl = document.getElementById('scheduleTimeline');
    timelineEl.innerHTML = '';

    masterSchedule.forEach(w => {
      const isCurrent = (w.id === currentWeek.id);
      const item = document.createElement('div');
      item.className = 'timeline-item' + (isCurrent ? ' active-week' : '');

      let taskSummary = w.tasks.map(t => `• <b>[${t.subject}]</b> ${t.action}`).join('<br>');

      item.innerHTML = `
        <div class="timeline-title">${w.label} ${isCurrent ? '👈 (今ここ)' : ''}</div>
        <div class="timeline-desc" style="margin-bottom:6px;">期間: ${w.start} 〜 ${w.end}</div>
        <div class="timeline-desc">${taskSummary}</div>
      `;
      timelineEl.appendChild(item);
    });
  }

  // PWAサービスワーカー
  if ('serviceWorker' in navigator) {
    const swCode = `self.addEventListener('fetch', function(e) {});`;
    const blob = new Blob([swCode], { type: 'text/javascript' });
    const swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).catch(() => {});
  }

  setTheme(currentTheme);
  scheduleNotification();
  render();
</script>
